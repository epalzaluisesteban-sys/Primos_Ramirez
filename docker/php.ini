; Ajustes de PHP para producción (Render). Sin esto PHP solo acepta archivos de 2 MB:
; fallarían las fotos tomadas con el teléfono y la restauración de respaldos (hasta 100 MB).
upload_max_filesize = 100M
post_max_size = 110M
memory_limit = 384M
max_execution_time = 120
expose_php = Off
date.timezone = America/Caracas

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; El código no cambia dentro del contenedor: no hace falta revisar si los archivos cambiaron
opcache.validate_timestamps = 0
